name: Build Pi Agent Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pi_version:
        description: "Pi version to bake in (empty = latest)"
        required: false
        default: ""
  # Rebuild weekly so :latest picks up new pi releases
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # ---- Aliyun Container Registry (ACR) settings ----
  # Registry host: use your region, e.g. registry.cn-shanghai.aliyuncs.com,
  # registry.cn-beijing.aliyuncs.com, registry.us-west-1.aliyuncs.com ...
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # ACR namespace (the "folder" you created in the ACR console)
  NAMESPACE: lulinw
  # Repository name inside the namespace
  IMAGE_NAME: pi-agent
  # Platforms to build.
  # NOTE: ACR Personal Edition does NOT support multi-arch manifest lists.
  # Keep "linux/amd64" unless you use ACR Enterprise Edition, then you can
  # switch to "linux/amd64,linux/arm64".
  PLATFORMS: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          # access-key-id: ${{ secrets.ALIYUN_KEYID }}
          # access-key-secret: ${{ secrets.ALIYUN_KEYSECRET }}
          username: "${{ secrets.ALIYUN_USER }}"
          password: "${{ secrets.ALIYUN_PSWD  }}"
      - name: Build and push image
        env:
          IMAGE_TAG: 0.84.0
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
