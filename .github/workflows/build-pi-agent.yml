name: Build Pi Agent Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pi_version:
        description: "Pi version to bake in (empty = latest)"
        required: false
        default: ""
  # Rebuild weekly so :latest picks up new pi releases
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # ---- Aliyun Container Registry (ACR) settings ----
  # Registry host: use your region, e.g. registry.cn-shanghai.aliyuncs.com
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # ACR namespace (the "folder" you created in the ACR console)
  NAMESPACE: lulinw
  # Repository name inside the namespace
  IMAGE_NAME: pi-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # IMPORTANT: login-server MUST be passed as an input here.
      # Without it, aliyun/acr-login falls back to index.docker.io (Docker Hub)
      # and pollutes docker.io credentials -> base image pulls fail with 401.
      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PSWD }}

      - name: Extract image metadata (tags)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64   # ACR Personal Edition: single platform only
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags || format('{0}/{1}/{2}:ci-test', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) }}
          build-args: |
            PI_VERSION=${{ inputs.pi_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint pi \
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:ci-test \
            --version
